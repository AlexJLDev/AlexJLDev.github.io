<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Alex GIEL — Développeur web</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --ink: #f6ead2;
            --gold: #e8b65c;
            --dk: #2b1a0c;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        html,
        body {
            margin: 0;
            background: #17261f;
            color: var(--ink);
            font-family: 'DM Sans', system-ui, sans-serif
        }

        #spacer {
            height: 700vh
        }

        #stage {
            position: fixed;
            inset: 0;
            overflow: hidden;
            perspective: 2800px
        }

        #tilt {
            position: absolute;
            inset: 0
        }

        #signs {
            position: absolute;
            inset: 0;
            pointer-events: none
        }

        #fog {
            position: fixed;
            inset: 0 0 55% 0;
            pointer-events: none;
            background: linear-gradient(rgba(220, 234, 228, .6), transparent)
        }

        #world {
            position: absolute;
            left: 0;
            top: 0;
            will-change: transform
        }

        #world svg {
            display: block;
            width: 100%;
            height: 100%
        }

        #tint,
        #vig {
            position: fixed;
            inset: 0;
            pointer-events: none
        }

        #tint {
            mix-blend-mode: multiply
        }

        #vig {
            background: radial-gradient(ellipse at 50% 55%, transparent 55%, rgba(6, 14, 10, .6))
        }

        .sign {
            position: absolute;
            left: 0;
            top: 0;
            width: var(--w);
            transform-origin: 50% 100%;
            opacity: 0;
            pointer-events: none;
            transition: opacity .5s;
            filter: drop-shadow(0 16px 12px rgba(0, 0, 0, .35));
            will-change: transform
        }

        .sign.on {
            opacity: 1;
            pointer-events: auto
        }

        .kiosk {
            transform: translateY(-26px) scale(.92);
            transition: transform .8s cubic-bezier(.2, 1.4, .4, 1)
        }

        .on .kiosk {
            transform: none
        }

        .roof {
            height: 38px;
            margin: 0 -11px -2px;
            background: linear-gradient(180deg, rgba(255, 255, 255, .22) 0 42%, transparent 42%), repeating-linear-gradient(90deg, transparent 0 17px, rgba(90, 60, 25, .25) 17px 18px), linear-gradient(100deg, #ecd0a0 0 50%, #d2ab72 50%);
            clip-path: polygon(9% 0, 91% 0, 100% 100%, 0 100%)
        }

        .fr {
            position: relative;
            padding: 0 16px 60px
        }

        .fr i {
            position: absolute;
            top: -4px;
            bottom: 0;
            width: 15px;
            background: linear-gradient(90deg, #e6bc86 0 50%, #c4955c 50%)
        }

        .fr i:first-child {
            left: 0
        }

        .fr i:last-child {
            right: 0
        }

        .board {
            background: #f1ecd2;
            border-top: 3px solid #cfa56d;
            border-bottom: 12px solid #cfa56d;
            padding: 0 14px 10px;
            color: #27311f
        }

        .map {
            height: 38px;
            margin: 0 -14px 10px;
            background: linear-gradient(125deg, #78aa68 0 24%, #4f8f58 24% 41%, #a6c779 41% 63%, #cfdc9e 63% 80%, #6aa0b8 80%);
            clip-path: polygon(0 0, 100% 0, 100% 80%, 64% 100%, 32% 82%, 0 100%)
        }

        .board small {
            display: block;
            font-size: 13px;
            color: #a4531f;
            margin-bottom: 5px
        }

        .board h3 {
            margin: 0 0 6px;
            font: 800 clamp(18px, 1.55vw, 22px)/1 'Bricolage Grotesque', sans-serif;
            letter-spacing: -.02em;
            color: #1f3a2a
        }

        .board p {
            margin: 0 0 8px;
            font-size: 12.5px;
            line-height: 1.45;
            color: #33402b
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px
        }

        .tags span {
            white-space: nowrap;
            font-size: 12px;
            padding: 3px 10px;
            border: 1px solid rgba(39, 49, 31, .4);
            border-radius: 99px
        }

        .btn {
            display: inline-block;
            margin: 2px 6px 4px 0;
            padding: 8px 14px;
            border-radius: 99px;
            background: #2f6b45;
            color: #f6f0d8;
            font-weight: 500;
            font-size: 14px;
            text-decoration: none
        }

        .btn:hover,
        .btn:focus-visible {
            background: #1f4a30;
            outline: 2px solid #1f4a30;
            outline-offset: 2px
        }

        nav {
            position: fixed;
            top: calc(14px + env(safe-area-inset-top, 0px));
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 8px 6px 18px;
            border-radius: 99px;
            background: rgba(18, 32, 26, .55);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(246, 234, 210, .15);
            z-index: 5;
            white-space: nowrap
        }

        nav b {
            font: 800 17px 'Bricolage Grotesque', sans-serif;
            margin-right: 10px
        }

        nav a {
            color: var(--ink);
            text-decoration: none;
            font-size: 14px;
            padding: 7px 12px;
            border-radius: 99px;
            cursor: pointer
        }

        nav a:hover,
        nav a:focus-visible {
            background: rgba(246, 234, 210, .16);
            outline: none
        }

        #hero {
            position: fixed;
            left: 5vw;
            bottom: calc(11vh + env(safe-area-inset-bottom, 0px));
            z-index: 4;
            pointer-events: none;
            text-shadow: 0 4px 40px rgba(10, 20, 15, .55)
        }

        #hero h1 {
            margin: 0;
            font: 800 clamp(52px, 10vw, 150px)/.88 'Bricolage Grotesque', sans-serif;
            letter-spacing: -.04em
        }

        #hero p {
            margin: 18px 0 0;
            font-size: clamp(16px, 1.6vw, 21px);
            max-width: 30ch;
            line-height: 1.4
        }

        #hud {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            bottom: calc(16px + env(safe-area-inset-bottom, 0px));
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 8px 18px;
            border-radius: 99px;
            background: rgba(18, 32, 26, .55);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(246, 234, 210, .15);
            font-size: 13px;
            z-index: 5;
            white-space: nowrap
        }

        #bar {
            flex: 1;
            height: 3px;
            background: rgba(246, 234, 210, .2);
            border-radius: 3px;
            overflow: hidden
        }

        #bar i {
            display: block;
            height: 100%;
            width: 0;
            background: var(--gold)
        }

        .smoke {
            animation: sm 4s infinite ease-out;
            opacity: 0
        }

        .smoke:nth-of-type(2) {
            animation-delay: 1.3s
        }

        .smoke:nth-of-type(3) {
            animation-delay: 2.6s
        }

        @keyframes sm {
            0% {
                opacity: .6;
                transform: translateY(0) scale(.6)
            }

            100% {
                opacity: 0;
                transform: translateY(-50px) scale(1.8)
            }
        }

        button.btn {
            border: 0;
            font-family: inherit;
            cursor: pointer
        }

        dialog {
            border: 0;
            padding: 0;
            background: transparent;
            max-width: none;
            max-height: none;
            width: 100%;
            height: 100%;
            color: #27311f
        }

        dialog[open] {
            display: grid;
            place-items: center
        }

        dialog::backdrop {
            background: rgba(8, 18, 13, .65);
            backdrop-filter: blur(6px)
        }

        .mc {
            overscroll-behavior: contain;
            position: relative;
            width: min(900px, 92vw);
            max-height: 88vh;
            overflow: auto;
            background: #f1ecd2;
            border: 6px solid #cfa56d;
            border-bottom-width: 14px;
            clip-path: polygon(0 16px, 16px 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 0 100%);
            animation: pop .55s cubic-bezier(.2, 1.3, .4, 1)
        }

        @keyframes pop {
            from {
                opacity: 0;
                transform: translateY(40px) rotate(-1.5deg) scale(.95)
            }
        }

        .x {
            position: absolute;
            top: 12px;
            right: 14px;
            z-index: 2;
            width: 38px;
            height: 38px;
            border: 0;
            background: #f1ecd2;
            color: #1f3a2a;
            font-size: 18px;
            cursor: pointer;
            clip-path: polygon(25% 0, 75% 0, 100% 25%, 100% 75%, 75% 100%, 25% 100%, 0 75%, 0 25%)
        }

        .x:hover,
        .x:focus-visible {
            background: #fff;
            outline: none
        }

        .hd {
            position: relative;
            height: 190px
        }

        .hd svg {
            display: block;
            width: 100%;
            height: 100%
        }

        .ht {
            position: absolute;
            left: 28px;
            bottom: 16px;
            color: #fff;
            text-shadow: 0 2px 18px rgba(0, 0, 0, .5)
        }

        .ht small {
            font-size: 14px
        }

        .ht h2 {
            margin: 2px 0 0;
            font: 800 clamp(34px, 5vw, 56px)/1 'Bricolage Grotesque', sans-serif;
            letter-spacing: -.03em
        }

        .bd {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 8px 36px;
            padding: 24px 28px 8px
        }

        .bd p {
            margin: 0 0 12px;
            line-height: 1.6;
            font-size: 15px;
            color: #33402b;
            max-width: 60ch
        }

        .bd h4 {
            margin: 14px 0 6px;
            font: 700 15px 'Bricolage Grotesque', sans-serif;
            color: #a4531f
        }

        .bd h4:first-child {
            margin-top: 0
        }

        .bd ul {
            margin: 0;
            padding-left: 18px;
            line-height: 1.7;
            font-size: 15px
        }

        .ft {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: space-between;
            align-items: center;
            padding: 14px 28px 22px
        }

        .nv {
            border: 1px solid rgba(39, 49, 31, .45);
            background: none;
            color: #27311f;
            border-radius: 99px;
            padding: 7px 14px;
            font: inherit;
            font-size: 14px;
            cursor: pointer;
            margin-left: 6px
        }

        .nv:hover,
        .nv:focus-visible {
            background: #27311f;
            color: #f1ecd2;
            outline: none
        }

        .btn.alt {
            background: none;
            color: #2f6b45;
            border: 1px solid #2f6b45
        }

        @media(prefers-reduced-motion:reduce) {
            .mc {
                animation: none
            }
        }

        #hud svg {
            display: block
        }

        #mm {
            width: min(340px, 38vw);
            height: 34px;
            overflow: visible
        }

        #mm .pin {
            cursor: pointer
        }

        #mm .pin:hover polygon {
            fill: #fff
        }

        .an {
            cursor: pointer
        }

        .an:hover {
            filter: brightness(1.3)
        }

        .pu {
            animation: pu 1.6s infinite ease-in-out
        }

        @keyframes pu {
            50% {
                opacity: .2
            }
        }

        #bub {
            position: fixed;
            left: 50%;
            bottom: calc(76px + env(safe-area-inset-bottom, 0px));
            transform: translate(-50%, 12px);
            max-width: min(420px, 88vw);
            padding: 12px 18px;
            border-radius: 14px;
            background: #f1ecd2;
            color: #27311f;
            font-size: 14px;
            line-height: 1.45;
            opacity: 0;
            pointer-events: none;
            transition: .35s;
            z-index: 6;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .35)
        }

        #bub.on {
            opacity: 1;
            transform: translate(-50%, 0)
        }

        .shot {
            margin: 0 -14px 10px;
            border-bottom: 3px solid #cfa56d;
            line-height: 0
        }

        .shot svg,
        .shot img {
            display: block;
            width: 100%;
            height: auto
        }

        .hd img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top
        }

        .hd::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(transparent 35%, rgba(0, 0, 0, .55))
        }

        .ht {
            z-index: 1
        }

        .pa {
            display: inline-grid;
            place-items: center;
            min-width: 40px;
            height: 40px;
            padding: 0 13px;
            box-sizing: border-box;
            white-space: nowrap;
            margin: 3px;
            color: #fff;
            font: 800 11px 'Bricolage Grotesque', sans-serif;
            outline: 2px dashed rgba(255, 255, 255, .8);
            outline-offset: -4px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, .45)
        }

        #night {
            position: fixed;
            inset: 0 0 40% 0;
            pointer-events: none;
            opacity: 0;
            mix-blend-mode: screen;
            overflow: hidden;
            background: radial-gradient(1.5px 1.5px at 12% 18%, #fff, transparent 60%), radial-gradient(1px 1px at 28% 8%, #fff, transparent 60%), radial-gradient(1.5px 1.5px at 44% 24%, #fff, transparent 60%), radial-gradient(1px 1px at 61% 12%, #fff, transparent 60%), radial-gradient(1.5px 1.5px at 77% 28%, #fff, transparent 60%), radial-gradient(1px 1px at 90% 10%, #fff, transparent 60%), radial-gradient(1px 1px at 5% 40%, #fff, transparent 60%), radial-gradient(1px 1px at 52% 40%, #fff, transparent 60%)
        }

        #night::before {
            content: '';
            position: absolute;
            inset: 6% -10% 22%;
            background: linear-gradient(100deg, transparent 8%, rgba(80, 255, 170, .5) 32%, rgba(90, 160, 255, .45) 58%, rgba(190, 90, 255, .35) 80%, transparent);
            filter: blur(28px);
            transform: skewX(-14deg);
            animation: au 9s infinite alternate ease-in-out
        }

        @keyframes au {
            to {
                transform: skewX(10deg) translateX(8%);
                opacity: .55
            }
        }

        .pcard {
            position: relative;
            width: min(820px, 92vw);
            max-height: 90vh;
            overflow: auto;
            box-sizing: border-box;
            background: #f6f0dc;
            padding: 30px;
            display: grid;
            grid-template-columns: 1.15fr 1fr;
            gap: 20px 30px;
            transform: rotate(-1deg);
            border: 10px solid;
            border-image: repeating-linear-gradient(135deg, #c4281c 0 14px, #f6f0dc 14px 22px, #2457a6 22px 36px, #f6f0dc 36px 44px) 10;
            animation: pop .6s cubic-bezier(.2, 1.3, .4, 1);
            color: #27311f
        }

        .pcard h2 {
            margin: 0 0 10px;
            font: 800 30px/1 'Bricolage Grotesque', sans-serif;
            color: #1f3a2a
        }

        .pcard textarea,
        .pcard input {
            width: 100%;
            box-sizing: border-box;
            border: 0;
            background: repeating-linear-gradient(transparent 0 27px, rgba(39, 49, 31, .28) 27px 28px);
            font: 16px/28px 'DM Sans', sans-serif;
            color: #27311f;
            padding: 0 4px
        }

        .pcard textarea {
            height: 196px;
            resize: none
        }

        .pcard input {
            height: 30px;
            background: none;
            border-bottom: 1.5px solid rgba(39, 49, 31, .5);
            margin: 2px 0 14px
        }

        .pcard label {
            font-size: 13px;
            color: #a4531f
        }

        .pcard :focus-visible {
            outline: 2px solid #2f6b45;
            outline-offset: 2px
        }

        .ad {
            border-left: 1.5px solid rgba(39, 49, 31, .4);
            padding-left: 24px;
            position: relative
        }

        .st {
            width: 60px;
            margin: 0 0 20px auto
        }

        .pm {
            position: absolute;
            top: 30px;
            right: 62px;
            width: 74px;
            height: 74px;
            border: 2px solid rgba(39, 49, 31, .45);
            border-radius: 50%;
            display: grid;
            place-items: center;
            text-align: center;
            font-size: 10px;
            line-height: 1.2;
            transform: rotate(-14deg);
            color: rgba(39, 49, 31, .6)
        }

        .to {
            margin: 4px 0 16px;
            font-size: 14px;
            line-height: 1.7
        }

        .pcard.sent::after {
            content: 'Envoyée';
            position: absolute;
            right: 10%;
            bottom: 16%;
            font: 800 38px 'Bricolage Grotesque', sans-serif;
            color: #c4281c;
            border: 4px solid #c4281c;
            padding: 4px 14px;
            transform: rotate(-12deg);
            animation: st .5s cubic-bezier(.2, 2, .4, 1)
        }

        @keyframes st {
            from {
                transform: rotate(-12deg) scale(2.4);
                opacity: 0
            }
        }

        @media(max-width:700px) {
            .pcard {
                grid-template-columns: 1fr
            }

            .ad {
                border-left: 0;
                padding-left: 0
            }

            #alt {
                display: none
            }
        }

        @media(max-width:700px) {
            nav a:nth-child(n+4) {
                display: none
            }

            nav b {
                margin-right: 2px
            }
        }

        @media(prefers-reduced-motion:reduce) {
            .board {
                transition: none
            }

            .smoke {
                animation: none
            }
        }
    </style>
</head>

<body>
    <div id="stage">
        <div id="tilt">
            <div id="world"><svg id="svg" viewBox="-300 0 1800 5200" preserveAspectRatio="none"
                    aria-hidden="true"></svg></div>
        </div>
        <div id="signs"></div>
    </div>
    <div id="fog"></div>
    <div id="tint"></div>
    <div id="night"></div>
    <div id="vig"></div>
    <nav><b>AG</b><a data-f="0">Accueil</a><a data-f=".18">À propos</a><a data-f=".33">Stack</a><a
            data-f=".55">Projets</a><a data-f=".87">Contact</a></nav>
    <div id="hero">
        <h1>Alex<br>Giel</h1>
        <p>Développeur web. Je construis des applications rapides et soignées pour les professionnels. Suivez le
            sentier.</p>
    </div>
    <div id="hud"><svg id="cp" width="30" height="30" viewBox="-15 -15 30 30" aria-hidden="true">
            <circle r="13" fill="none" stroke="#f6ead2" stroke-opacity=".5" />
            <g id="cn">
                <polygon points="0,-11 3,0 -3,0" fill="#e8b65c" />
                <polygon points="0,11 3,0 -3,0" fill="#f6ead2" opacity=".6" />
            </g>
        </svg><span id="km">0,0 km</span><svg id="mm" viewBox="0 0 400 40"></svg><span id="alt"></span></div>
    <div id="bub" role="status"></div>
    <dialog id="dlg" aria-labelledby="mt">
        <div class="mc"><button class="x" type="button" aria-label="Fermer" data-x>✕</button>
            <div id="mb"></div>
        </div>
    </dialog>
    <dialog id="pc" aria-label="Carte postale">
        <div class="pcard"><button class="x" type="button" aria-label="Fermer" data-x>✕</button>
            <div>
                <h2>Cher Alex,</h2><textarea id="pmsg" aria-label="Votre message"
                    placeholder="Racontez-moi votre projet…"></textarea>
            </div>
            <div class="ad">
                <div class="st"><svg viewBox="0 0 64 76" aria-hidden="true">
                        <rect x="2" y="2" width="60" height="72" fill="#f6f0dc" stroke="#27311f" stroke-width="2"
                            stroke-dasharray="3 3" />
                        <polygon
                            points="32,12 38,28 50,24 44,40 56,44 42,54 46,66 34,60 32,70 30,60 18,66 22,54 8,44 20,40 14,24 26,28"
                            fill="#c4281c" />
                    </svg></div>
                <div class="pm">Amiens<br>FR</div><label for="pn">Votre nom</label><input id="pn"
                    autocomplete="name"><label for="pe">Votre courriel</label><input id="pe" type="email"
                    autocomplete="email">
                <div class="to">À : Alex Giel<br>Cabane au bout du sentier<br>Amiens, France</div><button class="btn"
                    type="button" id="ps">Poster la carte</button>
            </div>
        </div>
    </dialog>
    <div id="spacer"></div>
    <script>
        (() => {
            const VH = 5200, K = 1.2, TH = 50 * Math.PI / 180, PER = 2800, cT = Math.cos(TH), sT = Math.sin(TH); let seed = 11;
            const R = () => (seed = seed * 16807 % 2147483647) / 2147483647, rr = (a, b) => a + R() * (b - a);
            const pathX = y => 600 + 200 * Math.sin(y / 420) + 60 * Math.sin(y / 140);
            const P = []; let L = 0;
            for (let y = 4620; y >= 1000; y -= 30) { const x = pathX(y), q = P[P.length - 1]; if (q) L += Math.hypot(x - q.x, y - q.y); P.push({ x, y, l: L }) }
            const at = f => { const l = Math.min(Math.max(f, 0), 1) * L; let i = 1; while (i < P.length - 1 && P[i].l < l) i++; const a = P[i - 1], b = P[i], k = (l - a.l) / (b.l - a.l || 1); return { x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k } };
            const pl = (p, f) => `<polygon points="${p}" fill="${f}"/>`;
